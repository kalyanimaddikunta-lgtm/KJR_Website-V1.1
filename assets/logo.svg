<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="100%" height="100%">
  <defs>
    <!-- Vibrant Orange Gradient for J, road, and framing -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb057" />
      <stop offset="50%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#cc5200" />
    </linearGradient>

    <!-- Silver-White Metallic Gradient for K and R -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>

    <!-- Dark Shadow Gradient for Fold crease -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter for Letters to create 3D lift -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g id="kjr-logo-mark">
    <!-- 1. SOLID HIGHWAY SWEEPING ROAD (BOTTOM) - Rendered behind letters -->
    <g id="sweeping-road">
      <!-- Road Deck (Solid slate/charcoal color with perspective) -->
      <path d="M 25,123 Q 90,147 260,113 L 260,119 Q 90,154 25,138 Z" fill="#0f121d" opacity="0.95" />
      
      <!-- Road Outer Borders (Solid Orange Lines) -->
      <path d="M 25,123 Q 90,147 260,113" stroke="url(#orangeGrad)" stroke-width="2.2" fill="none" stroke-linecap="round" />
      <path d="M 25,138 Q 90,154 260,119" stroke="url(#orangeGrad)" stroke-width="2.2" fill="none" stroke-linecap="round" />
      
      <!-- Highway Dash Lanes (Dashed Yellow/Orange Line in perspective) -->
      <path d="M 25,130.5 Q 90,150.5 260,116" stroke="#ffb057" stroke-width="1.2" stroke-dasharray="3, 8" fill="none" stroke-linecap="round" opacity="0.85" />
    </g>

    <!-- 2. STACKED 3D BUILDING BLOCKS (LEFT) -->
    <g id="building-glowing-windows" opacity="0.95">
      <!-- BLOCK B (Bottom-Right) -->
      <!-- Top Face -->
      <path d="M 75,90 L 60,97 L 75,104 L 90,97 Z" fill="url(#orangeGrad)" />
      <!-- Left Face -->
      <path d="M 60,97 L 60,115 L 75,122 L 75,104 Z" fill="#ff6a00" />
      <!-- Right Face -->
      <path d="M 75,104 L 75,122 L 90,115 L 90,97 Z" fill="#cc5200" />

      <!-- BLOCK E (Center-Right, Stacked on top of B) -->
      <!-- Top Face -->
      <path d="M 75,70 L 60,77 L 75,84 L 90,77 Z" fill="url(#orangeGrad)" />
      <!-- Left Face -->
      <path d="M 60,77 L 60,95 L 75,102 L 75,84 Z" fill="#ff6a00" />
      <!-- Right Face -->
      <path d="M 75,84 L 75,102 L 90,95 L 90,77 Z" fill="#cc5200" />

      <!-- BLOCK A (Bottom-Left) -->
      <!-- Top Face -->
      <path d="M 45,100 L 30,107 L 45,114 L 60,107 Z" fill="url(#orangeGrad)" />
      <!-- Left Face -->
      <path d="M 30,107 L 30,125 L 45,132 L 45,114 Z" fill="#ff6a00" />
      <!-- Right Face -->
      <path d="M 45,114 L 45,132 L 60,125 L 60,107 Z" fill="#cc5200" />

      <!-- BLOCK D (Center-Left, Stacked on top of A) -->
      <!-- Top Face -->
      <path d="M 45,80 L 30,87 L 45,94 L 60,87 Z" fill="url(#orangeGrad)" />
      <!-- Left Face -->
      <path d="M 30,87 L 30,105 L 45,112 L 45,94 Z" fill="#ff6a00" />
      <!-- Right Face -->
      <path d="M 45,94 L 45,112 L 60,105 L 60,87 Z" fill="#cc5200" />

      <!-- BLOCK C (Top-Middle, Step stack) -->
      <!-- Top Face -->
      <path d="M 60,75 L 45,82 L 60,89 L 75,82 Z" fill="url(#orangeGrad)" />
      <!-- Left Face -->
      <path d="M 45,82 L 45,100 L 60,107 L 60,89 Z" fill="#ff6a00" />
      <!-- Right Face -->
      <path d="M 60,89 L 60,107 L 75,100 L 75,82 Z" fill="#cc5200" />
    </g>

    <!-- 3. Building Wireframe Grid Lines -->
    <g id="building-grid" stroke="#ffffff" stroke-width="0.85" opacity="0.45" fill="none">
      <line x1="25" y1="88" x2="25" y2="114" />
      <line x1="42" y1="73" x2="42" y2="121" />
      <line x1="60" y1="58" x2="60" y2="128" />
      <line x1="80" y1="73" x2="80" y2="121" />
      <line x1="95" y1="88" x2="95" y2="110" stroke-width="1.2" stroke="#e2e8f0" />
      
      <path d="M 25,114 L 60,128" />
      <path d="M 25,100 L 60,114" />
      <path d="M 25,86 L 60,100" />
      <path d="M 42,73 L 60,86" />
      
      <path d="M 60,128 L 95,110" />
      <path d="M 60,114 L 95,96" />
      <path d="M 60,100 L 95,82" />
      <path d="M 60,86 L 80,73" />
      
      <path d="M 25,88 L 60,58 L 95,88" />
    </g>

    <!-- 4. FRAMING LINES -->
    <!-- Top-Left Frame (White) -->
    <path d="M 175,25 L 105,25 L 105,65" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75" />
    <!-- Top-Right Frame (Orange) -->
    <path d="M 195,25 L 290,25 L 290,65" stroke="url(#orangeGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Bottom-Right Frame (White) -->
    <path d="M 290,85 L 290,115 L 195,115" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75" />

    <!-- 5. LETTERS (WITH 3D SHADOW FILTER) -->
    <g id="letters-group" filter="url(#dropShadow)">
      <!-- LETTER K -->
      <path d="M 125,35 L 142,35 L 142,68 L 175,35 L 194,35 L 153,74 L 196,115 L 176,115 L 142,80 L 142,115 L 125,115 Z" 
            fill="url(#silverGrad)" />

      <!-- LETTER J -->
      <path d="M 198,35 L 216,35 L 216,88 C 216,110 196,124 165,124 C 145,124 130,118 123,112 L 132,102 C 138,107 149,112 165,112 C 185,112 198,104 198,88 Z" 
            fill="url(#orangeGrad)" />

      <!-- LETTER R WITH 3D RIBBON FOLD -->
      <g id="letter-r-with-fold">
        <!-- Stem of R -->
        <rect x="226" y="35" width="17" height="80" fill="url(#silverGrad)" />
        <!-- Leg of R -->
        <path d="M 252,72 L 270,72 L 296,115 L 277,115 Z" fill="url(#silverGrad)" />
        <!-- Loop of R -->
        <path d="M 243,35 L 272,35 L 292,55 L 292,62 C 292,68 286,72 271,72 L 243,72 Z M 243,45 L 268,45 C 278,45 281,49 281,54 C 281,59 278,62 268,62 L 243,62 Z" 
              fill="url(#silverGrad)" />
        
        <!-- Underlying fold shadow -->
        <path d="M 272,35 L 272,55 L 292,55 Z" fill="url(#shadowGrad)" />
        <!-- Folded flap (brighter metallic white for depth) -->
        <path d="M 272,35 L 292,55 L 272,55 Z" fill="#ffffff" />
        <!-- Crease line -->
        <line x1="272" y1="35" x2="272" y2="55" stroke="#cbd5e1" stroke-width="0.5" />
      </g>
    </g>
  </g>
</svg>
